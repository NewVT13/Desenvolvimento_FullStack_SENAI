<!doctype html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>IMC</title>
		<script src="script.js"></script>
		<style>
			h1,
			p {
				margin: 0;
			}
			body {
				background-color: #e1e9f0;
			}
			.container_principal {
				background-color: #fff;
				width: 40%;
				margin: 40px auto;
				border-radius: 4px;

				box-shadow:
					rgba(0, 0, 0, 0.25) 0px 54px 55px,
					rgba(0, 0, 0, 0.12) 0px -12px 30px,
					rgba(0, 0, 0, 0.12) 0px 4px 6px,
					rgba(0, 0, 0, 0.17) 0px 12px 13px,
					rgba(0, 0, 0, 0.09) 0px -3px 5px;
				padding: 20px;
			}
			.titulo {
				font-size: 32px;
				color: #3e3e3e;
				font-weight: bold;
				margin: 0;
			}
			.descrição {
				color: #3e3e3e;
				font-size: 18px;
			}

			.label_imput {
				font-size: 16px;
				font-weight: bold;
				color: #3e3e3e;
			}
			.imput {
				width: 100%;
				height: 34px;
				margin-top: 10px;
				border: 1px #e1e9f0 solid;
				border-radius: 4px;
				padding-left: 10px;
				font-size: 18px;
				color: #3e3e3e;
			}
			.imput:focus {
				border-width: 2px;
				border-color: #ccd9e4;
				outline: none;
			}
			.botao_calcular {
				width: 80%;
				height: 34px;
				background-color: #0d9987;
				border-radius: 4px;
				color: #fff;
				margin-top: 10px;
				border: none;
			}
		</style>
	</head>
	<body>
		<div class="container_principal">
			<h1 class="titulo">Calculadora de IMC</h1>
			<p>Descubra seu Indice de Massa corporea</p>
			<label class="label_imput" for="altura">Altura</label>
			<input
				placeholder="Digite sua altura"
				class="imput"
				type="number"
				id="altura"
			/>
			<label class="label_imput" for="peso">Peso</label>
			<input placeholder="Digite seu peso" class="imput" type="number" id="peso" />
			<button class="botao_calcular" onclick="calcular()">Calcular</button>
			<button>Limpar</button>
			<p id="resultado"></p>
		</div>
	</body>
</html>
