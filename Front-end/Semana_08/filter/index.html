<!doctype html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>exemplos de array</title>
		<script src="exemplos_array.js" defer></script>
		<style>
			.form_conteiner {
				width: 50%;
				margin: 40px auto;
				padding: 10px;
				min-height: 80px;
				background-color: tomato;

				display: flex;
				justify-content: center;
				align-items: center;
				flex-direction: column;
			}
			input {
				height: 34px;
				border-radius: 8px;
				width: 100%;
			}
			.email_container {
				background-color: #d5d0d0;
				padding: 10px;
				border-radius: 8px;
				margin-bottom: 20px;
			}
		</style>
	</head>
	<body>
		<h1>exemplos de array</h1>

		<form id="form_pesquisa" class="form_conteiner">
			<input type="text" placeholder="Pesquise por uma palavra" id="codigo" />
		</form>
		<ul id="lista"></ul>
	</body>
</html>
